<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuckGR</title>
<meta name="theme-color" content="#1d2a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The texts live in the language files (platform/locales/): data-i18n* attributes hold their keys. -->
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="a" id="worldName"></span><small>DuckGR</small></div>
    <div class="top-r" id="topBar"></div>
  </header>

  <!-- SCREEN: GAME -->
  <main id="screenGame" class="wrap">
    <div class="stage" id="stage">
    <section class="card mission" id="mission"></section>
    <div class="tools">
      <div class="seg" id="buildBar"></div>
      <div class="seg">
        <button id="openInv" data-i18n-title="board.inventoryTitle"><span data-i18n="board.inventory"></span> <span class="key" data-i18n="key.inventory"></span></button>
        <button id="showField" aria-pressed="false" data-i18n-title="board.showFieldTitle"><span data-i18n="board.showField"></span> <span class="key" data-i18n="key.showField"></span></button>
      </div>
      <div id="queue" class="queue"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="board" id="board"><canvas id="cv"></canvas><div class="cell-menu" id="cellMenu" hidden></div>
      <div class="cam-ctrl" data-i18n-aria-label="board.camera">
        <button id="zoomIn" data-i18n-title="board.zoomInTitle" data-i18n-aria-label="board.zoomIn">+</button>
        <button id="zoomOut" data-i18n-title="board.zoomOutTitle" data-i18n-aria-label="board.zoomOut">−</button>
        <button id="follow" data-i18n-title="board.followTitle" data-i18n-aria-label="board.follow" aria-pressed="false">◎</button>
        <button id="pauseCam" data-i18n-title="board.pauseTitle" data-i18n-aria-label="board.pause">⏸</button>
        <button id="fullscreen" data-i18n-title="board.fullscreenTitle" data-i18n-aria-label="board.fullscreen">⛶</button>
      </div>
    </div>
    </div>
    <div class="cols">
      <div class="wrap" style="gap:12px;margin:0;max-width:none">
        <section class="card"><div class="row"><h3 data-i18n="panel.inventory"></h3><button class="linkbtn" id="openInv2" data-i18n="panel.openInventory"></button></div><div class="chips" id="inventory"></div><div class="hint" id="playerInfo"></div></section>
        <section class="card"><h3 data-i18n="panel.research"></h3><div id="research" class="wrap" style="gap:6px;margin:0;max-width:none"></div></section>
      </div>
      <div class="wrap" style="gap:12px;margin:0;max-width:none">
        <section class="card"><h3 id="cellTitle"></h3><dl class="layers" id="cell"></dl></section>
        <section class="card"><h3 data-i18n="panel.shortcuts"></h3><div class="shortcuts" id="shortcuts"></div></section>
      </div>
    </div>
    <div class="eras" id="eras"></div>
    <section class="card log"><h3 data-i18n="panel.log"></h3><ol id="log"></ol></section>
    <div class="foot" id="footer"></div>
  </main>

  <!-- SCREEN: MENU -->
  <main id="screenMenu" class="wrap" hidden>
    <h1 class="screen-title" data-i18n="menu.title"></h1>
    <div class="menu-grid">
      <button class="option primary" data-go="game"><h2 data-i18n="menu.continue"></h2><p data-i18n="menu.continueText"></p></button>
      <button class="option" id="newDefault"><h2 data-i18n="menu.newGame"></h2><p data-i18n="menu.newGameText"></p></button>
      <button class="option" data-go="setup"><h2 data-i18n="menu.setup"></h2><p data-i18n="menu.setupText"></p></button>
      <button class="option" data-go="save"><h2 data-i18n="menu.save"></h2><p data-i18n="menu.saveText"></p></button>
      <button class="option" data-go="settings"><h2 data-i18n="menu.settings"></h2><p data-i18n="menu.settingsText"></p></button>
      <button class="option" id="howToPlay"><h2 data-i18n="menu.howToPlay"></h2><p data-i18n="menu.howToPlayText"></p></button>
    </div>
    <p class="foot" data-i18n="menu.about"></p>
  </main>

  <!-- SCREEN: SETTINGS -->
  <main id="screenSettings" class="wrap" hidden>
    <h1 class="screen-title" data-i18n="settings.title"></h1>
    <section class="card form" id="prefsForm"></section>
    <section class="card">
      <h3 data-i18n="settings.savedGame"></h3>
      <p class="muted small" style="margin:0" data-i18n="settings.savedGameText"></p>
      <div class="actions"><button class="btn danger" id="deleteSave" data-i18n="settings.deleteSave"></button></div>
    </section>
    <section class="card">
      <h3 data-i18n="settings.offline"></h3>
      <p class="muted small" style="margin:0" data-i18n="settings.offlineText"></p>
      <p class="hint" style="margin:0" id="offlineStatus"></p>
      <div class="actions"><button class="btn primary" id="installApp" data-i18n="settings.install" hidden></button></div>
    </section>
    <div class="actions"><button class="btn primary" data-go="game" data-i18n="common.backToGame"></button><button class="btn" data-go="menu" data-i18n="top.menu"></button></div>
  </main>

  <!-- SCREEN: SAVE AND LOAD -->
  <main id="screenSave" class="wrap" hidden>
    <h1 class="screen-title" data-i18n="save.title"></h1>
    <p class="muted" style="margin:0;max-width:65ch" data-i18n="save.intro"></p>
    <section class="card"><h3 data-i18n="save.sizeTitle"></h3><div id="saveInfo" class="muted" data-i18n="save.computing"></div></section>
    <section class="card">
      <h3 data-i18n="save.takeTitle"></h3>
      <div class="actions"><button class="btn primary" id="downloadSave" data-i18n="save.download"></button><button class="btn" id="copySave" data-i18n="save.copy"></button></div>
      <p class="hint" style="margin:0" id="exportInfo" data-i18n="save.exportInfo"></p>
    </section>
    <section class="card">
      <h3 data-i18n="save.openTitle"></h3>
      <div class="actions"><label class="btn" for="saveFile" style="cursor:pointer" data-i18n="save.openFile"></label><input type="file" id="saveFile" accept=".duckgr,application/gzip,application/json" hidden></div>
      <div class="field"><label for="saveCode" data-i18n="save.pasteLabel"></label><textarea id="saveCode" rows="3" placeholder="H4sIA…"></textarea></div>
      <div class="actions"><button class="btn" id="pasteSave" data-i18n="save.openCode"></button></div>
    </section>
    <div class="actions"><button class="btn primary" data-go="game" data-i18n="common.backToGame"></button><button class="btn" data-go="menu" data-i18n="top.menu"></button></div>
  </main>

  <!-- SCREEN: WORLD SETUP -->
  <main id="screenSetup" class="wrap" hidden>
    <h1 class="screen-title" data-i18n="setup.title"></h1>
    <section class="card form" id="worldForm"></section>
    <div class="preview" id="preview"><canvas id="previewCanvas"></canvas></div>
    <p class="hint" id="previewInfo"></p>
    <div class="actions"><button class="btn primary" id="startSetup" data-i18n="setup.start"></button><button class="btn" data-go="menu" data-i18n="common.back"></button></div>
  </main>
</div>

<div class="alert" id="invScreen" hidden>
  <div class="box inv-box" role="dialog" aria-labelledby="invTitle">
    <div class="row"><h2 id="invTitle" data-i18n="panel.inventory"></h2><button class="btn" id="closeInv"><span data-i18n="common.close"></span> <span class="key" data-i18n="key.inventory"></span></button></div>
    <div class="slots" id="slots"></div>
    <h3 data-i18n="inventory.craftTitle"></h3>
    <div id="craft" class="wrap" style="gap:6px;margin:0;max-width:none"></div>
    <p class="hint" id="invPlayer"></p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="alert" id="alert" hidden><div class="box" id="alertBox"><h2 id="alertTitle"></h2><div id="alertText"></div><button class="btn primary" id="alertBtn"></button></div></div>

<script type="module" src="platform/app.js"></script>
</body>
</html>
